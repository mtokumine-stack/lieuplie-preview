const bag=(small=false)=>'<div class="photo photo-placeholder" aria-label="ギフト袋の仮イラスト。写真準備中"><svg viewBox="0 0 90 100" fill="none" stroke="currentColor" aria-hidden="true"><path d="M20 26h50l5 63H15zM20 26l8 10h34l8-10M28 36l-3 53M62 36l3 53"/><path d="M32 26c0-22 26-22 26 0"/><circle cx="45" cy="58" r="9"/><path d="M41 58h8M45 54v8"/></svg><span>イラスト・写真準備中</span></div>';
const choice=({name,value,title,description='',price='',kind='',disabled=false,extra=''})=>'<label class="choice '+extra+'" for="'+name+'-'+value+'">'+(kind?icon(kind):'')+'<span class="choice-copy"><span class="choice-title">'+title+'</span>'+(description?'<span class="choice-description">'+description+'</span>':'')+(price?'<span class="choice-price">'+price+'</span>':'')+'</span><input type="radio" id="'+name+'-'+value+'" name="'+name+'" value="'+value+'"'+check(name in state?state[name]:state.gift[name],value)+(disabled?' disabled':'')+'></label>';
const error=(key)=>'<p class="error" id="error-'+key+'" role="alert">'+esc(state.errors[key]||'')+'</p>';
const heading=(kicker,title,intro='')=>'<div class="eyebrow">'+kicker+'</div><h1 id="step-heading" tabindex="-1">'+title+'</h1>'+(intro?'<p class="intro">'+intro+'</p>':'');
const wrapTitle=()=>state.mode==='card'?'包装なし':state.gift.wrap==='box'?'ギフトボックス＋リボン':state.gift.wrap==='bag'?'ギフト袋＋シール':'未選択';
const boxTitle=()=>state.gift.box==='ivory'?'アイボリー':state.gift.box==='navy'?'ネイビー':'未選択';
const boxImage=()=>state.gift.box==='navy'?'./box_mens.png':'./box_ladies.png';
function settings(){return '<details class="settings"><summary>見本の設定</summary><label class="checkbox-label"><input type="checkbox" id="recurring"'+checked(state.recurring)+'><span>定期お届けを含む注文にする</span></label><p>画面の制限を確認するための設定です。入力内容はこのページ内だけで保持します。</p></details>'}
function step1(){return heading('DELIVERY & PAYMENT','ギフト包装を<br class="mobile-only">利用しますか？','お届け方法を選ぶ前に、包装をお選びください。')+'<fieldset aria-describedby="error-mode"><legend class="sr-only">ギフト包装の利用</legend><div class="choices">'+choice({name:'mode',value:'normal',title:'通常のお届け',description:'ギフト包装をつけずにお届け',kind:'normal'})+choice({name:'mode',value:'gift',title:'ギフト包装をつける',description:'無料の袋 または 箱 500円（税込）',kind:'gift',disabled:state.recurring})+'</div></fieldset>'+error('mode')+'<button type="button" class="text-button cardonly" id="card-only"'+(state.recurring?' disabled':'')+'>包装せず、カードだけつける<span aria-hidden="true">→</span></button>'+(state.recurring?'<div class="notice" role="status"><strong>この注文ではギフトを利用できません。</strong><br>定期お届けの商品が含まれるため、包装・カードは選べません。受取方法を変えても同じです。</div>':'<div class="notice">配送でも、店頭受取でもご利用いただけます。<br>ギフトは、ご注文全体を1つにお包みします。</div>')}
function step2(){return heading('GIFT / 包装','包装をお選びください','ご注文全体を、1つにお包みします。')+'<fieldset aria-describedby="error-wrap"><legend class="sr-only">包装</legend><div class="choices"><label class="choice photo-choice" for="wrap-bag">'+bag()+'<span class="choice-copy"><span class="choice-title">ギフト袋<br>＋シール</span><span class="choice-description">気軽に贈れる包装</span><span class="choice-price">無料</span></span><input id="wrap-bag" type="radio" name="wrap" value="bag"'+check(state.gift.wrap,'bag')+'></label><label class="choice photo-choice" for="wrap-box"><img class="photo" src="./box_ladies.png" alt="アイボリーの箱にピンクのリボンをかけたギフトボックスのイメージ"><span class="choice-copy"><span class="choice-title">ギフトボックス<br>＋リボン</span><span class="choice-description">箱とリボンの色を選べます</span><span class="choice-price">500円（税込）</span></span><input id="wrap-box" type="radio" name="wrap" value="box"'+check(state.gift.wrap,'box')+'></label></div></fieldset>'+error('wrap')+'<p class="small" style="margin-top:15px">袋は仮のイラストです。実物の写真は準備中です。</p>'}
const ribbonImg=k=>'./ribbon_'+k+'.webp';
function ribbonVisual(){return '<img class="ribbon-photo" src="'+ribbonImg(state.gift.ribbon)+'" alt="'+ribbon()[1]+'のリボンのイメージ">'}
function step3(){return heading('GIFT / 箱とリボン','箱の色をお選びください','リボンは、箱に合わせた色をお付けします。')+'<fieldset aria-describedby="error-box"><legend class="sr-only">箱の色</legend><div class="box-grid">'+[['ivory','アイボリー','./box_ladies.png','ピンク'],['navy','ネイビー','./box_mens.png','ネイビー']].map(([v,t,img,rb])=>'<label class="choice box-choice" for="box-'+v+'"><img src="'+img+'" alt="'+t+'の箱と'+rb+'のリボンの標準の組合せ。イメージ"><span class="box-caption"><span class="choice-title">'+t+'</span><input type="radio" id="box-'+v+'" name="box" value="'+v+'"'+check(state.gift.box,v)+'></span></label>').join('')+'</div></fieldset>'+error('box')+(state.gift.box?'<div class="ribbon-current">'+ribbonVisual()+'<div><p>リボン：'+ribbon()[1]+'</p><span class="small">'+(state.gift.ribbonCustom?'選んだ色を使用します':'箱に合わせた標準の色')+'</span></div><button class="text-button" type="button" id="toggle-ribbons" aria-expanded="'+state.ribbonsOpen+'" aria-controls="ribbon-panel">リボンの色を変える<span aria-hidden="true">'+(state.ribbonsOpen?'−':'＋')+'</span></button></div>'+(state.ribbonsOpen?'<section class="ribbon-panel" id="ribbon-panel"><p class="small">Lieu plie のロゴ入りリボンです。10色からお選びください。写真はイメージです。</p><fieldset><legend class="sr-only">リボンの色</legend><div class="ribbon-grid">'+ribbonColors.map(r=>'<label class="ribbon-option" title="'+r[2]+'" for="ribbon-'+r[0]+'"><img class="ribbon-img" src="'+ribbonImg(r[0])+'" alt="" loading="lazy"><span class="ribbon-name">'+r[1]+'</span><input type="radio" name="ribbon" id="ribbon-'+r[0]+'" value="'+r[0]+'"'+check(state.gift.ribbon,r[0])+' aria-label="'+r[1]+' ('+r[2]+')"></label>').join('')+'</div></fieldset></section>':''):'')+'<p class="small" style="margin-top:16px">箱の写真は標準の組合せです。<br>リボンは、選択した色になります。</p>'}
const limits={to:15,line1:20,line2:20,line3:20,from:15};
const charCount=s=>Array.from(s).length;
function messageError(key){const value=state.gift[key],max=limits[key];if(charCount(value)>max)return max+'字以内で入力してください（現在'+charCount(value)+'字）。';if(/[\p{Extended_Pictographic}\p{Regional_Indicator}\u20e3]/u.test(value))return '絵文字は使えません。文字に置き換えてください。';return ''}
function field(key,label,limit){const err=state.errors[key]||'';return '<div class="field"><label for="'+key+'">'+label+'<span class="optional">任意</span></label><input type="text" id="'+key+'" data-card-field="'+key+'" value="'+esc(state.gift[key])+'" autocomplete="off" aria-describedby="help-'+key+' error-'+key+'" aria-invalid="'+!!err+'"><div class="field-meta"><p class="error" id="error-'+key+'"'+(err?' role="alert"':'')+'>'+esc(err)+'</p><span class="count" id="help-'+key+'">'+charCount(state.gift[key])+' / '+limit+'字</span></div></div>'}
function preview(){return '<div class="preview-wrap"><div class="preview-label"><span>印刷イメージ</span><span>名刺サイズ 91 × 55 mm</span></div><div class="print-preview" aria-label="メッセージカードの印刷見本"><div class="preview-template" id="preview-template"></div><p class="preview-to" id="preview-to"></p><div class="preview-lines"><p id="preview-line1"></p><p id="preview-line2"></p><p id="preview-line3"></p></div><p class="preview-from" id="preview-from"></p></div><p class="empty-card-note" id="empty-card-note"></p></div>'}
function step4(){return heading('GIFT / メッセージ','メッセージカードを<br class="mobile-only">つけますか？','名刺サイズのカードに印刷します。無料です。')+(state.mode==='card'?'<p class="small" style="margin-bottom:14px">包装なし・カードのみを選択中</p>':'')+'<fieldset><legend class="sr-only">メッセージカード</legend><div class="inline-choices"><label class="choice" for="card-no"><span class="choice-copy"><span class="choice-title">つけない</span></span><input type="radio" id="card-no" name="card" value="no"'+checked(!state.gift.card)+'></label><label class="choice" for="card-yes"><span class="choice-copy"><span class="choice-title">つける</span><span class="choice-description">無料</span></span><input type="radio" id="card-yes" name="card" value="yes"'+checked(state.gift.card)+'></label></div></fieldset>'+(state.gift.card?'<section class="card-form"><div class="field"><label for="template">カードのデザイン</label><select id="template">'+['Happy Birthday','Thank you','For you','無地'].map(t=>'<option value="'+t+'"'+(state.gift.template===t?' selected':'')+'>'+t+(t==='無地'?'（メッセージのみ）':'')+'</option>').join('')+'</select></div><p class="small">メッセージは任意です。絵文字は使えません。</p>'+field('to','宛名',15)+'<div class="message-fields"><p>メッセージ <span class="optional" style="font-size:11px;font-weight:400;color:var(--muted)">1行20字・3行まで</span></p>'+field('line1','1行目',20)+field('line2','2行目',20)+field('line3','3行目',20)+'</div>'+field('from','差出人',15)+preview()+'</section>':'<div class="notice">カードをつけずに進めます。<br>後から「変更」で追加することもできます。</div>')}
function summaryRow(label,value,edit){return '<div class="summary-row"><dt>'+label+'</dt><dd>'+value+'</dd>'+(edit?'<button type="button" data-edit="'+edit+'" aria-label="'+label+'を変更">変更</button>':'')+'</div>'}
function cardSummary(){if(!state.gift.card||!activeGift())return 'つけない';let text=esc(state.gift.template)+(state.gift.template==='無地'?'（メッセージのみ）':'')+'<br><span class="small">無料・名刺サイズの印刷</span>';let lines=['to','line1','line2','line3','from'].map(k=>state.gift[k]).filter(Boolean);if(lines.length)text+='<div class="message-summary">'+esc(lines.join('\n'))+'</div>';else text+='<p class="small">'+(state.gift.template==='無地'?'空白のカード':'メッセージの入力なし')+'</p>';return text}
function summaryDetails(editable=true){return '<dl class="summary-list">'+(state.mode==='gift'&&state.sendTo?summaryRow('お届け先',state.sendTo==='recipient'?'お相手に直接送る<br>'+rcText():'ご自分で受け取る',editable?(state.sendTo==='recipient'?9:8):null):'')+summaryRow('包装',esc(wrapTitle())+(state.mode==='gift'?'<p class="small">ご注文全体を1つに包装</p>':''),editable?2:null)+(boxed()?summaryRow('箱の色',boxTitle(),editable?3:null)+summaryRow('リボン',esc(ribbon()[1]),editable?3:null):'')+summaryRow('カード',cardSummary(),editable?4:null)+'</dl>'}
function hero(){return '<div class="summary-hero">'+(boxed()?'<img src="'+boxImage()+'" alt="選んだ箱の標準の組合せのイメージ">':state.mode==='card'?icon('card'):bag(true))+'<div><h2>'+wrapTitle()+'</h2><p>'+(boxed()?boxTitle()+' / リボン '+ribbon()[1]:state.mode==='card'?'メッセージカードのみ':'無料のギフト包装')+'</p></div></div>'}
function step5(){return heading('GIFT / 内容の確認','ギフトの内容を<br class="mobile-only">ご確認ください','選んだ内容は、あとから変更できます。')+hero()+summaryDetails()+'<div class="amount-row"><span>包装代 <small>（税込）</small></span><strong>'+yen(fee())+'</strong></div><div class="receipt-option"><label class="checkbox-label" for="hide-price"><input type="checkbox" id="hide-price"'+checked(state.gift.hidePrice)+'><span>明細に金額を載せない<small>同梱する明細が対象です。<br>購入履歴・確認メールには金額が表示されます。</small></span></label></div>'+(boxed()?'<p class="small" style="margin-top:13px">箱の写真は標準の組合せです。リボンは選択した色になります。</p>':'')+(state.mode==='card'?'<div class="notice">カードのみの場合の同梱方法は確認中です。<br>この見本では、選ぶ流れをご確認いただけます。</div>':'')+'<button class="text-button" type="button" data-edit="1" style="margin-top:12px">ギフトの利用を変更</button>'}
function rcField(k,label,ph,ac,im){const err=state.errors['rc_'+k]||'';return '<div class="field"><label for="rc-'+k+'">'+label+'<span class="optional">必須</span></label><input type="'+(k==='phone'?'tel':'text')+'" id="rc-'+k+'" data-rc="'+k+'" value="'+esc(state.rc[k])+'" placeholder="'+ph+'" autocomplete="'+ac+'"'+(im?' inputmode="'+im+'"':'')+' aria-invalid="'+!!err+'" aria-describedby="error-rc_'+k+'"><div class="field-meta"><p class="error" id="error-rc_'+k+'"'+(err?' role="alert"':'')+'>'+esc(err)+'</p></div></div>'}
const z2h=v=>String(v).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xfee0));
function rcErrors(){const r=state.rc,e={};if(!r.name.trim()||Array.from(r.name.trim()).length>30)e.rc_name='お相手のお名前を入力してください（30文字まで）。';if(!/^\d{7}$/.test(z2h(r.postal).replace(/\D/g,'')))e.rc_postal='郵便番号を7桁で入力してください。';if(Array.from(r.address.trim()).length<6)e.rc_address='ご住所を番地まで入力してください。';if(!/^0\d{9,10}$/.test(z2h(r.phone).replace(/\D/g,'')))e.rc_phone='電話番号を入力してください（配送伝票に使います）。';return e}
const rcText=()=>esc(state.rc.name)+' 様<br><span class="small">〒'+esc(z2h(state.rc.postal).replace(/\D/g,'').replace(/^(\d{3})(\d{4})$/,'$1-$2'))+' '+esc(state.rc.address)+'</span>';
function step8(){return heading('GIFT / お届け先','ギフトは<br class="mobile-only">どちらへ届けますか？','お届け先によって、このあとの入力が変わります。')+'<fieldset aria-describedby="error-sendTo"><legend class="sr-only">ギフトのお届け先</legend><div class="choices">'+sendChoice('recipient','贈る相手に直接送る','お相手のご住所へ、お店で包装してお送りします。金額の載らない明細を同梱します。','send')+sendChoice('self','ご自分で受け取って渡す','ご自宅への配送、または店頭で受け取れます。','self')+'</div></fieldset>'+error('sendTo')}
function sendChoice(v,t,d,ic){const icons={send:'<path d="M4 13h20v14H4zM24 17h7l5 5v5H24"/><circle cx="11" cy="29" r="3"/><circle cx="30" cy="29" r="3"/><path d="M9 13c-3-4 1-7 5-1 4-6 8-3 5 1"/>',self:'<circle cx="20" cy="12" r="6"/><path d="M8 35c1-8 6-12 12-12s11 4 12 12"/>'};return '<label class="choice" for="sendTo-'+v+'"><svg class="choice-icon" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">'+icons[ic]+'</svg><span class="choice-copy"><span class="choice-title">'+t+'</span><span class="choice-description">'+d+'</span></span><input type="radio" id="sendTo-'+v+'" name="sendTo" value="'+v+'"'+check(state.sendTo,v)+'></label>'}
function step9(){return heading('GIFT / お相手のお届け先','お相手の<br class="mobile-only">お届け先を入力してください','郵便番号を入れると、住所が自動で入ります（本番）。')+'<div class="rc-form">'+rcField('name','お相手のお名前','例）佐藤 美咲','name')+rcField('postal','郵便番号','例）150-0001','postal-code','numeric')+rcField('address','ご住所（番地・建物名まで）','例）東京都渋谷区神宮前1-2-3','street-address')+rcField('phone','電話番号','例）090-1234-5678','tel','tel')+'</div><div class="notice">電話番号は配送伝票に使います。<br>お相手のご住所はこのご注文にだけ使い、会員情報には保存しません。</div>'}
function step6(){const toRc=activeGift()&&state.mode==='gift'&&state.sendTo==='recipient';if(toRc)state.delivery='recipient';else if(state.delivery==='recipient')state.delivery='';if(toRc)return heading('DELIVERY & PAYMENT','お支払い方法を<br class="mobile-only">お選びください','ギフトは、お相手のご住所へお送りします。')+'<div class="address"><strong>お届け先：お相手</strong><p>'+rcText()+'</p><p>お店でギフト包装をして発送します。通常のお届けより数日多くかかります。</p><button class="text-button" type="button" data-edit="9">お届け先を変更</button></div>'+paySection();return heading('DELIVERY & PAYMENT','受取方法を<br class="mobile-only">お選びください','続けて、お支払い方法をお選びください。')+'<fieldset aria-describedby="error-delivery"><legend class="sr-only">受取方法</legend><div class="choices delivery-options">'+choice({name:'delivery',value:'shipping',title:'ご自分に届ける',description:'会員登録されているご住所へ配送'})+choice({name:'delivery',value:'pickup',title:'店頭で受け取る',description:'大阪 または 沖縄のお店で'})+'</div></fieldset>'+error('delivery')+(state.delivery==='recipient'?'<div class="rc-form">'+rcField('name','お相手のお名前','例）佐藤 美咲','name')+rcField('postal','郵便番号','例）150-0001','postal-code','numeric')+rcField('address','ご住所（番地・建物名まで）','例）東京都渋谷区神宮前1-2-3','street-address')+rcField('phone','電話番号','例）090-1234-5678','tel','tel')+'<p class="small">電話番号は配送伝票に使います。お相手のご住所はこのご注文にだけ使い、会員情報には保存しません。</p><p class="small" style="margin-top:6px">お店でギフト包装をして発送します。通常のお届けより数日多くかかります。</p></div>':state.delivery==='shipping'?'<div class="address"><strong>お届け先：登録住所（見本）</strong><p>会員の登録住所にお届けします。</p><p>'+(state.mode==='card'&&activeGift()?'カードのみの場合の同梱方法は確認中です。':activeGift()?'お店でギフト包装をして発送します。<br>通常のお届けより数日多くかかります。':'メーカーより発送します。')+'</p></div>':state.delivery==='pickup'?'<div class="field"><label for="shop">受け取るお店<span class="required">選択してください</span></label><select id="shop" aria-describedby="error-shop"><option value="">お店をお選びください</option><option value="osaka"'+(state.shop==='osaka'?' selected':'')+'>大阪</option><option value="okinawa"'+(state.shop==='okinawa'?' selected':'')+'>沖縄</option></select>'+error('shop')+'</div>'+(activeGift()&&state.mode!=='card'?'<p class="small">お店で包装して、お渡しします。</p>':state.mode==='card'?'<p class="small">カードのみの場合の同梱方法は確認中です。</p>':''):'')+paySection()+(!activeGift()?'<div class="notice">ギフト包装・メッセージカード：なし'+(state.recurring?'<br>定期お届けを含むため、ご利用いただけません。':'')+'</div>':'<div class="notice">'+esc(wrapTitle())+' · 包装代 '+yen(fee())+'<br>カード：'+(state.gift.card?'つける':'つけない')+'</div>')+'<button class="text-button" type="button" id="edit-gift-delivery" style="margin-top:8px">ギフトの選択を変更</button>'}
function paySection(){return '<section class="payment-section"><h2 class="section-label">お支払い方法</h2><fieldset aria-describedby="error-payment"><legend class="sr-only">お支払い方法</legend><div class="choices payment-options">'+choice({name:'payment',value:'card',title:'クレジットカード'})+choice({name:'payment',value:'bank',title:'銀行振込'})+(state.delivery==='pickup'?choice({name:'payment',value:'store',title:'店頭で支払う'}):'')+'</div></fieldset>'+error('payment')+'<p class="small" style="margin-top:13px">操作見本のため、カード番号などの入力はありません。</p></section>'}
function step7(){return heading('ORDER REVIEW','ご注文内容の確認','受取方法とギフトの選択を確認できます。')+'<div class="final-badge">✓ 選んだ内容が反映されています</div><dl class="summary-list">'+summaryRow('受取方法',state.delivery==='recipient'?'贈る相手に直接送る<br>'+rcText():state.delivery==='pickup'?'店頭受取 · '+(state.shop==='osaka'?'大阪':'沖縄'):state.delivery==='recipient'?'贈る相手に直接送る<br>'+rcText():'ご自分に届ける<br><span class="small">登録住所（見本）</span>',6)+summaryRow('お支払い',{card:'クレジットカード',bank:'銀行振込',store:'店頭で支払う'}[state.payment],6)+'</dl>'+(activeGift()?hero()+summaryDetails()+ '<dl class="summary-list">'+summaryRow('明細の金額',state.gift.hidePrice?'載せない':'載せる',5)+'</dl>':'<div class="notice">通常のお届け · ギフト包装・カードなし'+(state.recurring?'<br>定期お届けを含む注文です。':'')+'</div>')+'<div class="amount-row"><span>包装代 <small>（税込）</small></span><strong>'+yen(fee())+'</strong></div><p class="small">この見本に表示する金額は、包装代のみです。<br>商品代金・送料などの注文総額ではありません。</p>'+(state.mode==='card'?'<div class="notice">カードのみの場合の同梱方法は確認中です。</div>':'')+'<div class="final-info"><h2>操作見本はここまでです</h2><p>注文は送信されません。選択を変えて、別の組合せもお試しいただけます。</p></div><button class="text-button" type="button" id="edit-gift-final" style="margin-top:10px">ギフトの選択を変更</button>'}
function sidebar(){return '<h2 class="aside-title">今回のお届け</h2>'+(boxed()?'<img class="aside-photo" src="'+boxImage()+'" alt="選んだ箱の標準の組合せのイメージ">':'')+'<div class="aside-step"><span>01</span><div>'+(activeGift()?wrapTitle():state.mode==='normal'?'通常のお届け':'包装を選ぶ')+'<p>'+(state.recurring?'定期お届けを含むため、ギフト不可':boxed()?boxTitle()+' / リボン '+ribbon()[1]:activeGift()&&state.mode==='gift'?'ご注文全体を1つに包装':state.mode==='card'?'包装なし・カードのみ':'')+'</p></div></div><div class="aside-step"><span>02</span><div>メッセージカード<p>'+(activeGift()?(state.gift.card?'つける・無料':'つけない'):'なし')+'</p></div></div><div class="aside-step"><span>03</span><div>受取方法<p>'+(state.delivery==='pickup'?'店頭受取'+(state.shop?' · '+(state.shop==='osaka'?'大阪':'沖縄'):''):state.delivery==='shipping'?'ご自分に届ける':state.delivery==='recipient'?'贈る相手に直接送る':'これから選びます')+'</p></div></div><div class="aside-amount"><span>包装代（税込）</span><strong>'+yen(fee())+'</strong></div><p class="aside-description">表示金額は包装代のみです。<br>商品代金・送料は含んでいません。</p>'}
function primaryText(){if(state.step===6)return 'ご注文内容を確認する';if(state.step===5)return '受取方法へ進む';if(state.editing&&state.step!==1)return '内容の確認へ戻る';if(state.step===1&&state.mode==='normal')return '受取方法へ進む';if(state.step===4)return 'ギフトの内容を確認する';return '次へ'}
function render(focusId){document.getElementById('main').innerHTML=({1:step1,2:step2,3:step3,4:step4,5:step5,6:step6,7:step7,8:step8,9:step9}[state.step])()+settings();document.getElementById('aside').innerHTML=sidebar();const footer=document.getElementById('footer');footer.hidden=state.step===7;footer.innerHTML=state.step===7?'':'<div class="footer-inner"><div class="footer-price"><span>選択中の包装代（税込）</span><strong>'+yen(fee())+'</strong></div><div class="footer-controls">'+(state.step!==1?'<button type="button" class="back-button" id="back-button">戻る</button>':'')+'<button type="button" class="primary-button" id="next-button">'+primaryText()+'<span class="arrow" aria-hidden="true">→</span></button></div></div>';document.getElementById('progress-delivery').classList.toggle('active',state.step!==7);document.getElementById('progress-confirm').classList.toggle('active',state.step===7);document.getElementById('progress-delivery').toggleAttribute('aria-current',state.step!==7);if(state.step!==7)document.getElementById('progress-delivery').setAttribute('aria-current','step');document.getElementById('progress-confirm').toggleAttribute('aria-current',state.step===7);if(state.step===7)document.getElementById('progress-confirm').setAttribute('aria-current','step');wire();updatePreview();if(focusId)document.getElementById(focusId)?.focus({preventScroll:true})}
function updatePreview(){if(!document.getElementById('preview-template'))return;document.getElementById('preview-template').textContent=state.gift.template==='無地'?'':state.gift.template;for(const k of Object.keys(limits))document.getElementById('preview-'+k).textContent=state.gift[k];document.getElementById('empty-card-note').textContent=state.gift.template==='無地'&&Object.keys(limits).every(k=>!state.gift[k])?'メッセージが未入力のため、空白のカードになります。':'入力した内容をそのまま印刷します。'}
function navigation(step,push=true){state.step=step;state.errors={};if(push)history.pushState({giftMock:true,step},'');render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('step-heading').focus({preventScroll:true})}
function validGiftStep(){if(!activeGift())return 1;if(state.mode==='gift'&&!state.sendTo)return 8;if(state.mode==='gift'&&state.sendTo==='recipient'&&Object.keys(rcErrors()).length)return 9;if(state.mode==='gift'&&!state.gift.wrap)return 2;if(boxed()&&!state.gift.box)return 3;if(state.gift.card){for(const key of Object.keys(limits))if(messageError(key))return 4}return 5}
function focusError(key){if(limits[key]){document.getElementById(key)?.focus();return}if(key.startsWith('rc_')){document.getElementById('rc-'+key.slice(3))?.focus();return}const id={sendTo:'sendTo-recipient',mode:'mode-normal',wrap:'wrap-bag',box:'box-ivory',delivery:'delivery-shipping',shop:'shop',payment:'payment-card'}[key];document.getElementById(id)?.focus()}
function fail(errors){state.errors=errors;render();focusError(Object.keys(errors)[0])}
function next(){if(state.step===1){if(!state.mode)return fail({mode:'通常のお届け、またはギフト包装を選んでください。'});if(state.mode==='normal'||state.recurring){state.editing=false;return navigation(6)}if(state.editing&&validGiftStep()===5){state.editing=false;return navigation(5)}return navigation(state.mode==='card'?4:8)}if(state.step===8){if(!state.sendTo)return fail({sendTo:'お届け先を選んでください。'});if(state.sendTo==='recipient')return navigation(9);if(state.editing){state.editing=false;return navigation(validGiftStep())}return navigation(2)}if(state.step===9){const e=rcErrors();if(Object.keys(e).length)return fail(e);if(state.editing){state.editing=false;return navigation(validGiftStep()===5?5:validGiftStep())}return navigation(2)}if(state.step===2){if(!state.gift.wrap)return fail({wrap:'包装を1つお選びください。'});if(state.editing){if(boxed()&&!state.gift.box)return navigation(3);state.editing=false;return navigation(validGiftStep())}return navigation(state.gift.wrap==='box'?3:4)}if(state.step===3){if(!state.gift.box)return fail({box:'箱の色を1つお選びください。'});if(state.editing){state.editing=false;return navigation(validGiftStep())}return navigation(4)}if(state.step===4){const errors={};if(state.gift.card)for(const key of Object.keys(limits)){const msg=messageError(key);if(msg)errors[key]=msg}if(Object.keys(errors).length)return fail(errors);if(state.mode==='card'&&!state.gift.card){state.mode='normal';state.editing=false;return navigation(6)}state.editing=false;return navigation(5)}if(state.step===5){const target=validGiftStep();if(target!==5)return navigation(target);return navigation(6)}if(state.step===6){const errors={};if(!state.delivery&&state.sendTo!=='recipient')errors.delivery='受取方法をお選びください。';if(state.delivery==='pickup'&&!state.shop)errors.shop='受け取るお店をお選びください。';if(!state.payment)errors.payment='お支払い方法をお選びください。';if(Object.keys(errors).length)return fail(errors);if(activeGift()&&validGiftStep()!==5)return navigation(validGiftStep());return navigation(7)}}
function back(){if(state.editing){state.editing=false;return navigation(5)}const prev={8:1,9:8,2:state.mode==='gift'?(state.sendTo==='recipient'?9:8):1,3:2,4:state.mode==='card'?1:state.gift.wrap==='box'?3:2,5:4,6:activeGift()?5:1,7:6}[state.step]||1;navigation(prev)}
function edit(step){state.editing=step<5||step===8||step===9;if(step===2&&state.mode==='card')step=1;navigation(step)}
function updateCardField(input){const key=input.dataset.cardField;state.gift[key]=input.value;const msg=messageError(key);state.errors[key]=msg;input.setAttribute('aria-invalid',String(!!msg));const errorNode=document.getElementById('error-'+key);errorNode.textContent=msg;if(msg)errorNode.setAttribute('role','alert');else errorNode.removeAttribute('role');document.getElementById('help-'+key).textContent=charCount(input.value)+' / '+limits[key]+'字';updatePreview()}
function wire(){document.querySelectorAll('input[type=radio]').forEach(input=>input.addEventListener('change',()=>{const {name,value,id}=input;if(name==='mode'){state.mode=value;state.editing=false}else if(name==='wrap'){state.gift.wrap=value}else if(name==='box'){state.gift.box=value;if(!state.gift.ribbonCustom)state.gift.ribbon=value==='navy'?'navy':'blush'}else if(name==='ribbon'){state.gift.ribbon=value;state.gift.ribbonCustom=true}else if(name==='card'){state.gift.card=value==='yes'}else if(name==='sendTo'){state.sendTo=value}else if(name==='delivery'){state.delivery=value;if(value!=='pickup'&&state.payment==='store')state.payment=''}else if(name==='payment')state.payment=value;delete state.errors[name];render(id)}));document.getElementById('next-button')?.addEventListener('click',next);document.getElementById('back-button')?.addEventListener('click',back);document.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click',()=>edit(Number(btn.dataset.edit))));document.getElementById('card-only')?.addEventListener('click',()=>{if(state.recurring)return;state.mode='card';state.gift.card=true;state.editing=false;navigation(4)});document.getElementById('toggle-ribbons')?.addEventListener('click',()=>{state.ribbonsOpen=!state.ribbonsOpen;render('toggle-ribbons')});document.getElementById('hide-price')?.addEventListener('change',e=>state.gift.hidePrice=e.target.checked);document.getElementById('template')?.addEventListener('change',e=>{state.gift.template=e.target.value;updatePreview()});document.getElementById('shop')?.addEventListener('change',e=>{state.shop=e.target.value;delete state.errors.shop;render('shop')});document.querySelectorAll('[data-card-field]').forEach(input=>{let composing=false;input.addEventListener('compositionstart',()=>composing=true);input.addEventListener('compositionend',()=>{composing=false;updateCardField(input)});input.addEventListener('input',e=>{state.gift[input.dataset.cardField]=input.value;if(!composing&&!e.isComposing)updateCardField(input)})});document.querySelectorAll('[data-rc]').forEach(i=>i.addEventListener('input',()=>{const k=i.dataset.rc;state.rc[k]=i.value;if(state.errors['rc_'+k]){delete state.errors['rc_'+k];i.setAttribute('aria-invalid','false');const n=document.getElementById('error-rc_'+k);if(n){n.textContent='';n.removeAttribute('role')}}}));for(const id of ['edit-gift-delivery','edit-gift-final'])document.getElementById(id)?.addEventListener('click',()=>{state.editing=false;navigation(activeGift()?5:1)});document.getElementById('recurring').addEventListener('change',e=>{state.recurring=e.target.checked;if(state.recurring){state.mode='normal';state.editing=false;if(state.step>=2&&state.step<=5)state.step=1}state.errors={};render();const details=document.querySelector('.settings');details.open=true;document.getElementById('recurring').focus({preventScroll:true});history.replaceState({giftMock:true,step:state.step},'')})}
window.addEventListener('popstate',e=>{if(!e.state?.giftMock)return;let target=e.state.step;if(!activeGift()&&((target>=2&&target<=5)||target>=8))target=1;if(state.mode==='card'&&(target===2||target===3))target=4;if(state.mode==='gift'&&state.gift.wrap!=='box'&&target===3)target=2;if(target>=5&&activeGift()&&validGiftStep()!==5)target=validGiftStep();state.editing=false;navigation(target,false)});
history.replaceState({giftMock:true,step:1},'');render();
</script>
</body>
